server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # The page and its scripts change with the code: always revalidate.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # The browser talks to its own origin; nginx forwards /api/ to the backend container by its
    # compose service name. Docker's DNS is re-queried so an api restart does not break the proxy.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://api:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
