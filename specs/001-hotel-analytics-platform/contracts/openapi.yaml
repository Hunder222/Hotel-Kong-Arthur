    # ---------- Errors ----------
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: Name of the invalid field or parameter.
          example: days_rented
        message:
          type: string
          example: Days rented must be a whole number from 1 to 365.
    Problem:
      type: object
      additionalProperties: false
      description: RFC 9457 Problem Details.
      required: [type, title, status]
      properties:
        type:
          type: string
          enum:
            - urn:hotel-kong-arthur:problem:malformed-request
            - urn:hotel-kong-arthur:problem:not-found
            - urn:hotel-kong-arthur:problem:validation-error
            - urn:hotel-kong-arthur:problem:service-unavailable
            - urn:hotel-kong-arthur:problem:internal-error
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 422
        detail:
          type: string
          example: 2 fields are invalid.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
