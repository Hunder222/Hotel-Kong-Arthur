openapi: 3.0.3
info:
  title: Hotel Kong Arthur Operations & Analytics API
  version: 1.0.0
  description: |
    REST/JSON API for Hotel Kong Arthur (feature `001-hotel-analytics-platform`).

    This file is the **authoritative contract** (OpenAPI 3.0.3, design-first). Swagger UI serves it,
    and the contract tests validate every response of the running code against it. FastAPI's own
    generated documentation is switched off.

    **Consumers**
    - Browser frontend (Receptionist): bookings through the frontend container's `/api/` proxy.
    - Tableau dashboard (Hotel CFO): built manually by the team outside this repository (FR-017).
      It reads the parameterless `GET` endpoints (`/api/v1/bookings`, `/api/v1/room-types`,
      `/api/v1/reviews`, `/api/v1/bar/drink-sales`) with JSONPath `$.items[*]` and calculates all
      hotel and bar KPIs (`A1`–`A7`, `B1`–`B3`, `K1`–`K3`) inside Tableau.
    - The hotel's existing booking system: `POST`, `PUT` and `DELETE` on `/api/v1/bookings`.

    **Conventions**
    - JSON field names use `snake_case`. Collection endpoints return an object with an `items` array.
    - No endpoint takes query parameters: `GET` collection endpoints return the full dataset so
      Tableau can filter, group, and aggregate directly on the extracted tables.
    - Amounts are in DKK, sent as JSON numbers rounded to 2 decimals.
    - `season` (`low` = Jan, Feb, Nov; `mid` = Mar, Apr, May, Sep, Oct; `high` = Jun, Jul, Aug, Dec)
      and `year` are derived by the API from `check_in_date` or `stay_date`. A stay belongs
      entirely to the season and year of its check-in date.
    - Every response carries `Cache-Control: no-store`.
    - Errors use RFC 9457 Problem Details (`application/problem+json`):
      - `400`: malformed JSON, or an invalid path parameter.
      - `404`: unknown id in the path.
      - `422`: a well-formed body that breaks a field or business rule.
      - `503`: database unavailable.
    - No authentication: this is a local prototype (see spec Assumptions). `Authorization`
      headers are ignored.
servers:
  - url: http://localhost:8000
    description: API container of the local docker compose stack
tags:
  - name: Health
    description: Liveness of the API and its database connection.
  - name: Reference data
    description: Static hotel facts (room types, room counts, seasonal rate bands).
  - name: Bookings
    description: Room bookings with full CRUD (F1) and raw booking records for Tableau (A1–A7, K1, K2).
  - name: Reviews
    description: Guest satisfaction reviews (K3 data, FR-011).
  - name: Bar
    description: Helene Christine's lobby bar sales per drink (B1–B3, FR-012).

paths:
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check that the API can reach its database
      responses:
        '200':
          description: API and database are up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/room-types:
    get:
      tags: [Reference data]
      operationId: listRoomTypes
      summary: List the 8 room types with room counts and seasonal rate bands
      description: |
        Static reference data. The 8 room types have 214 rooms in total. Each room type has one rate
        band per season, and its `standard_nightly_dkk` is used when a booking is saved without a
        price. Ordered by the canonical T1 order. Used by the Receptionist frontend and by Tableau
        for room inventory (`room_count`) in occupancy calculations (K1).
      responses:
        '200':
          description: All room types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomTypeList'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/bookings:
    get:
      tags: [Bookings]
      operationId: listBookings
      summary: List all bookings, newest first
      description: |
        Returns every booking ordered by `id` descending. Each booking includes its derived `season`
        and `year`. Takes no query parameters. **Scope:** F1 (FR-001, FR-002) and the raw booking
        dataset consumed by Tableau for A1–A7, K1 and K2 (FR-006–FR-010, FR-015).
      responses:
        '200':
          description: All bookings (possibly none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Bookings]
      operationId: createBooking
      summary: Create a booking
      description: |
        Validates the booking with the business rules (FR-003), derives the season and year from
        `check_in_date`, and stores it immediately (FR-005). If neither `price_dkk` nor
        `price_per_night_dkk` is given, the price is the room type's standard nightly rate for that
        season × `days_rented`. **Scope:** F1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
      responses:
        '201':
          description: Booking created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/bookings/{booking_id}:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [Bookings]
      operationId: getBooking
      summary: Get one booking
      responses:
        '200':
          description: The booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [Bookings]
      operationId: replaceBooking
      summary: Replace (edit) a booking
      description: |
        Replaces every client-editable field. The same validation applies as on create. If neither
        `price_dkk` nor `price_per_night_dkk` is given, the standard price is recalculated from the
        new values. **Scope:** F1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
      responses:
        '200':
          description: Booking updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Bookings]
      operationId: deleteBooking
      summary: Delete a booking
      description: |
        Removes the booking permanently. Reviews that referred to it keep their `room_type`,
        `stay_date` and `rating`, with `booking_id` set to `null`. **Scope:** F1.
      responses:
        '204':
          description: Booking deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/reviews:
    get:
      tags: [Reviews]
      operationId: listReviews
      summary: List all guest reviews, newest first
      description: |
        Returns every guest satisfaction review ordered by `id` descending, including derived
        `season` and `year`. Takes no query parameters. **Scope:** K3 (FR-011).
      responses:
        '200':
          description: All reviews (possibly none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewList'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Reviews]
      operationId: createReview
      summary: Record a guest review (rating 1–5)
      description: |
        Give **either** `booking_id` (the booking's room type and check-in date are copied) **or**
        both `room_type` and `stay_date`. Breaking this rule, or giving a `booking_id` that does not
        exist, returns `422`. **Scope:** K3 (FR-011).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '201':
          description: Review created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/reviews/{review_id}:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    get:
      tags: [Reviews]
      operationId: getReview
      summary: Get one review
      responses:
        '200':
          description: The review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/bar/drink-sales:
    get:
      tags: [Bar]
      operationId: listDrinkSales
      summary: List all lobby bar drink sales
      description: |
        Returns all drink sale rows from Helene Christine's lobby bar ordered by `id` ascending.
        Takes no query parameters. Tableau calculates revenue per drink (`unit_price_dkk * units_sold`),
        total bar sales, category splits and rankings from these rows. **Scope:** B1–B3, FR-012.
      responses:
        '200':
          description: All bar drink sales (possibly none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrinkSaleList'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  parameters:
    BookingId:
      name: booking_id
      in: path
      required: true
      description: Booking identifier.
      schema:
        type: integer
        minimum: 1
        example: 42
    ReviewId:
      name: review_id
      in: path
      required: true
      description: Review identifier.
      schema:
        type: integer
        minimum: 1
        example: 7

  headers:
    Location:
      description: Path of the created resource.
      schema:
        type: string
        example: /api/v1/bookings/1001

  responses:
    BadRequest:
      description: Malformed JSON, or an invalid path parameter.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:hotel-kong-arthur:problem:malformed-request
            title: Malformed request
            status: 400
            detail: A query or path parameter is invalid.
            errors:
              - field: booking_id
                message: Input should be greater than or equal to 1.
    NotFound:
      description: No resource with this id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:hotel-kong-arthur:problem:not-found
            title: Not found
            status: 404
            detail: Booking 4242 does not exist.
    ValidationFailed:
      description: The body is well-formed JSON, but one or more fields break the validation rules.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:hotel-kong-arthur:problem:validation-error
            title: Validation failed
            status: 422
            detail: 2 fields are invalid.
            errors:
              - field: days_rented
                message: Days rented must be a whole number from 1 to 365.
              - field: price_dkk
                message: 4,500.00 DKK for 3 nights is 1,500.00 DKK per night, outside 900.00–1,200.00 DKK per night for Standard Single in low season.
    ServiceUnavailable:
      description: The database cannot be reached.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:hotel-kong-arthur:problem:service-unavailable
            title: Service unavailable
            status: 503
            detail: The database is not reachable. Try again shortly.

  schemas:
    # ---------- Vocabulary ----------
    RoomTypeName:
      type: string
      description: One of Hotel Kong Arthur's 8 room types (English names, as in the sample data).
      enum:
        - Standard Single
        - Grand Lit
        - Standard Double
        - Superior Double
        - Junior Suite
        - Spa Executive
        - Suite
        - LOFT Suite
      example: Superior Double
    Season:
      type: string
      description: low = Jan, Feb, Nov; mid = Mar, Apr, May, Sep, Oct; high = Jun, Jul, Aug, Dec.
      enum: [low, mid, high]
      example: high
    DrinkCategory:
      type: string
      enum: [Cocktail, Coffee]
      example: Cocktail
    AmountDkk:
      type: number
      format: double
      minimum: 0
      description: Amount in DKK, rounded to 2 decimals.
      example: 4389.00
    Year:
      type: integer
      minimum: 2000
      maximum: 2100
      description: Calendar year (2000–2100).
      example: 2026
    Count:
      type: integer
      minimum: 0
      example: 1000

    # ---------- Health ----------
    Health:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [ok]

    # ---------- Reference data ----------
    SeasonRate:
      type: object
      additionalProperties: false
      required: [season, min_nightly_dkk, max_nightly_dkk, standard_nightly_dkk]
      properties:
        season:
          $ref: '#/components/schemas/Season'
        min_nightly_dkk:
          $ref: '#/components/schemas/AmountDkk'
        max_nightly_dkk:
          $ref: '#/components/schemas/AmountDkk'
        standard_nightly_dkk:
          $ref: '#/components/schemas/AmountDkk'
    RoomType:
      type: object
      additionalProperties: false
      required: [name, name_da, room_count, max_guests, rates]
      properties:
        name:
          $ref: '#/components/schemas/RoomTypeName'
        name_da:
          type: string
          description: Danish name from the assignment brief.
          example: Superior dobbeltværelse
        room_count:
          type: integer
          minimum: 1
          example: 27
        max_guests:
          type: integer
          minimum: 1
          maximum: 4
          example: 2
        rates:
          type: array
          description: One rate band per season, in the order low, mid, high.
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/SeasonRate'
    RoomTypeList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomType'

    # ---------- Bookings ----------
    BookingInput:
      type: object
      additionalProperties: false
      description: |
        Client-editable booking fields, used by both create (`POST`) and replace (`PUT`).
        Names and country are trimmed and must not be empty.
      required: [first_name, family_name, country, room_type, check_in_date, days_rented]
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Elena
        family_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Müller
        country:
          type: string
          minLength: 1
          maxLength: 100
          example: Germany
        room_type:
          $ref: '#/components/schemas/RoomTypeName'
        check_in_date:
          type: string
          format: date
          description: Check-in date (YYYY-MM-DD, years 2000–2100). The season and reporting year are derived from it.
          example: '2026-07-14'
        days_rented:
          type: integer
          minimum: 1
          maximum: 365
          description: Number of nights.
          example: 3
        price_dkk:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          description: |
            Total price in DKK with at most 2 decimals. If neither this nor `price_per_night_dkk` is
            given (omitted or `null`), the price is the room type's standard nightly rate for the
            season × `days_rented`. If it is given, `price_dkk / days_rented` must lie inside the room
            type's band for the season (see `GET /api/v1/room-types`). Giving `price_per_night_dkk`
            as well is a `422`.
          example: 6000.00
        price_per_night_dkk:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          description: |
            Fixed price per night in DKK with at most 2 decimals (FR-019). The stored total is this ×
            `days_rented`, and the price per night must lie inside the room type's band for the
            season. Mutually exclusive with `price_dkk`: giving both is a `422` reported on this
            field. A booking is read back with its total only (`price_dkk`).
          example: 2000.00
    Booking:
      type: object
      additionalProperties: false
      required: [id, first_name, family_name, country, room_type, check_in_date, days_rented, price_dkk, season, year, created_at, updated_at]
      properties:
        id:
          type: integer
          minimum: 1
          example: 1001
        first_name:
          type: string
          example: Elena
        family_name:
          type: string
          example: Müller
        country:
          type: string
          example: Germany
        room_type:
          $ref: '#/components/schemas/RoomTypeName'
        check_in_date:
          type: string
          format: date
          example: '2026-07-14'
        days_rented:
          type: integer
          minimum: 1
          maximum: 365
          example: 3
        price_dkk:
          $ref: '#/components/schemas/AmountDkk'
        season:
          $ref: '#/components/schemas/Season'
        year:
          $ref: '#/components/schemas/Year'
        created_at:
          type: string
          format: date-time
          example: '2026-10-27T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-10-27T12:00:00Z'
    BookingList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Booking'

    # ---------- Reviews ----------
    ReviewInput:
      type: object
      additionalProperties: false
      description: Give either `booking_id`, or both `room_type` and `stay_date`.
      required: [rating]
      properties:
        booking_id:
          type: integer
          minimum: 1
          example: 1001
        room_type:
          $ref: '#/components/schemas/RoomTypeName'
        stay_date:
          type: string
          format: date
          description: Check-in date of the reviewed stay (years 2000–2100).
          example: '2026-07-14'
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
    Review:
      type: object
      additionalProperties: false
      required: [id, booking_id, room_type, stay_date, season, year, rating, created_at]
      properties:
        id:
          type: integer
          minimum: 1
          example: 501
        booking_id:
          type: integer
          minimum: 1
          nullable: true
          description: The reviewed booking, or `null` if the review was recorded without one or the booking was deleted.
          example: 1001
        room_type:
          $ref: '#/components/schemas/RoomTypeName'
        stay_date:
          type: string
          format: date
          example: '2026-07-14'
        season:
          $ref: '#/components/schemas/Season'
        year:
          $ref: '#/components/schemas/Year'
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        created_at:
          type: string
          format: date-time
          example: '2026-10-27T12:05:00Z'
    ReviewList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Review'

    # ---------- Bar ----------
    DrinkSale:
      type: object
      additionalProperties: false
      required: [id, year, drink_name, category, unit_price_dkk, units_sold]
      properties:
        id:
          type: integer
          minimum: 1
          example: 1
        year:
          $ref: '#/components/schemas/Year'
        drink_name:
          type: string
          example: Margarita
        category:
          $ref: '#/components/schemas/DrinkCategory'
        unit_price_dkk:
          $ref: '#/components/schemas/AmountDkk'
        units_sold:
          $ref: '#/components/schemas/Count'
    DrinkSaleList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DrinkSale'

    # ---------- Errors ----------
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: Name of the invalid field or parameter.
          example: days_rented
        message:
          type: string
          example: Days rented must be a whole number from 1 to 365.
    Problem:
      type: object
      additionalProperties: false
      description: RFC 9457 Problem Details.
      required: [type, title, status]
      properties:
        type:
          type: string
          enum:
            - urn:hotel-kong-arthur:problem:malformed-request
            - urn:hotel-kong-arthur:problem:not-found
            - urn:hotel-kong-arthur:problem:validation-error
            - urn:hotel-kong-arthur:problem:service-unavailable
            - urn:hotel-kong-arthur:problem:internal-error
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 422
        detail:
          type: string
          example: 2 fields are invalid.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
