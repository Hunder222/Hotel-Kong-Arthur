openapi: 3.0.3
info:
  title: Hotel Kong Arthur Operations & Analytics API
  version: 1.1.0
  description: |
    REST/JSON API for Hotel Kong Arthur (feature `001-hotel-analytics-platform`, Week 2 update).

    This file is the **authoritative contract** (OpenAPI 3.0.3, design-first). Swagger UI serves it,
    and the contract tests validate every response of the running code against it. FastAPI's own
    generated documentation is switched off.

    **Consumers**
    - **Browser frontend (`frontend/`)**:
      - Receptionist Booking Management (`F1`): creates, edits, and deletes bookings via `/api/v1/bookings`.
      - Hotel Analytics Dashboard (`F2`, Week 2 `Tillægsopgave_uge_2.md`): reads pre-calculated hotel and
        bar KPIs directly from the **`Hotel Analytics`** endpoints (`/api/v1/kpis/hotel/*` and `/api/v1/kpis/bar/*`).
    - **Direct API Analytics Consumers**: query the **`Hotel Analytics`** `GET` endpoints (with optional
      filter attributes `year`, `season`, `room_type`, `country`, `category`, `price_tier`) to retrieve
      authoritative KPI calculations directly from the backend without needing Tableau.
    - **Tableau dashboard (Hotel CFO)**: connects to the parameterless raw collection `GET` endpoints
      (`/api/v1/bookings`, `/api/v1/room-types`, `/api/v1/reviews`, `/api/v1/bar/drink-sales`) with
      JSONPath `$.items[*]`, which are preserved 100% as-is from `v1.0.0`.
    - **The hotel's existing booking system**: `POST`, `PUT` and `DELETE` on `/api/v1/bookings`.

    **Conventions**
    - JSON field names use `snake_case`. Collection and KPI breakdown endpoints return an object with
      an `items` array. KPI summary endpoints (`summary`) return a single object.
    - Raw collection `GET` endpoints under `Reference data`, `Bookings`, `Reviews`, and `Bar` take
      **no query parameters** so Tableau extracts the full dataset.
    - Analytics `GET` endpoints under **`Hotel Analytics`** accept optional filter query parameters
      (`year`, `season`, `room_type`, `country`, `category`, `price_tier`). For `year`, passing a
      calendar year (`2000`–`2100`) filters to that year; passing `all` or omitting `year` aggregates
      across all years (`year: "all"`, FR-021).
    - Amounts are in DKK, sent as JSON numbers rounded to 2 decimals. Percentages run from 0 to 100
      with 2 decimals. When a denominator is 0, every share, average and rate is 0.
    - `season` (`low` = Jan, Feb, Nov; `mid` = Mar, Apr, May, Sep, Oct; `high` = Jun, Jul, Aug, Dec)
      and `year` are derived by the API from `check_in_date` or `stay_date`. A stay belongs
      entirely to the season and year of its check-in date.
    - Every response carries `Cache-Control: no-store`.
    - Errors use RFC 9457 Problem Details (`application/problem+json`):
      - `400`: malformed JSON, or an invalid query or path parameter.
      - `404`: unknown id in the path.
      - `422`: a well-formed body that breaks a field or business rule.
      - `503`: database unavailable.
    - No authentication: this is a local prototype (see spec Assumptions). `Authorization`
      headers are ignored.
servers:
  - url: http://localhost:8000
    description: API container of the local docker compose stack
tags:
  - name: Health
    description: Liveness of the API and its PostgreSQL database connection.
  - name: Reference data
    description: Static hotel facts (room types, room counts, seasonal rate bands).
  - name: Bookings
    description: Room bookings with full CRUD (F1) and raw booking records for Tableau (A1–A7, K1, K2).
  - name: Reviews
    description: Guest satisfaction reviews (K3 data, FR-011).
  - name: Bar
    description: Helene Christine's lobby bar raw sales per drink for Tableau (B1–B3, FR-012).
  - name: Hotel Analytics
    description: >-
      Backend-calculated hotel and cocktail bar analytics & KPIs (A1–A7, B1–B3, K1–K3) with filter
      attributes, allowing clients and the frontend prototype to get analytics directly via API.

paths:
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check that the API can reach its database
      responses:
        '200':
          description: API and database are up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/room-types:
    get:
      tags: [Reference data]
      operationId: listRoomTypes
      summary: List the 8 room types with room counts and seasonal rate bands
      description: |
        Static reference data. The 8 room types have 214 rooms in total. Each room type has one rate
        band per season, and its `standard_nightly_dkk` is used when a booking is saved without a
        price. Ordered by the canonical T1 order. Used by the Receptionist frontend and by Tableau
        for room inventory (`room_count`) in occupancy calculations (K1).
      responses:
        '200':
          description: All room types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomTypeList'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/bookings:
    get:
      tags: [Bookings]
      operationId: listBookings
      summary: List all bookings, newest first
      description: |
        Returns every booking ordered by `id` descending. Each booking includes its derived `season`
        and `year`. Takes no query parameters. **Scope:** F1 (FR-001, FR-002) and the raw booking
        dataset consumed by Tableau for A1–A7, K1 and K2 (FR-006).
      responses:
        '200':
          description: All bookings (possibly none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Bookings]
      operationId: createBooking
      summary: Create a booking
      description: |
        Validates the booking with the business rules (FR-003), derives the season and year from
        `check_in_date`, and stores it immediately in PostgreSQL (FR-005). If neither `price_dkk` nor
        `price_per_night_dkk` is given, the price is the room type's standard nightly rate for that
        season × `days_rented`. **Scope:** F1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
      responses:
        '201':
          description: Booking created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/bookings/{booking_id}:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [Bookings]
      operationId: getBooking
      summary: Get one booking
      responses:
        '200':
          description: The booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [Bookings]
      operationId: replaceBooking
      summary: Replace (edit) a booking
      description: |
        Replaces every client-editable field. The same validation applies as on create. If neither
        `price_dkk` nor `price_per_night_dkk` is given, the standard price is recalculated from the
        new values. **Scope:** F1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
      responses:
        '200':
          description: Booking updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Bookings]
      operationId: deleteBooking
      summary: Delete a booking
      description: |
        Removes the booking permanently. Reviews that referred to it keep their `room_type`,
        `stay_date` and `rating`, with `booking_id` set to `null`. **Scope:** F1.
      responses:
        '204':
          description: Booking deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/reviews:
    get:
      tags: [Reviews]
      operationId: listReviews
      summary: List all guest reviews, newest first
      description: |
        Returns every guest satisfaction review ordered by `id` descending, including derived
        `season` and `year`. Takes no query parameters. **Scope:** K3 (FR-011).
      responses:
        '200':
          description: All reviews (possibly none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewList'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Reviews]
      operationId: createReview
      summary: Record a guest review (rating 1–5)
      description: |
        Give **either** `booking_id` (the booking's room type and check-in date are copied) **or**
        both `room_type` and `stay_date`. Breaking this rule, or giving a `booking_id` that does not
        exist, returns `422`. **Scope:** K3 (FR-011).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '201':
          description: Review created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/reviews/{review_id}:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    get:
      tags: [Reviews]
      operationId: getReview
      summary: Get one review
      responses:
        '200':
          description: The review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/bar/drink-sales:
    get:
      tags: [Bar]
      operationId: listDrinkSales
      summary: List all lobby bar drink sales (raw dataset for Tableau)
      description: |
        Returns all drink sale rows from Helene Christine's lobby bar ordered by `id` ascending.
        Takes no query parameters so Tableau can extract the raw table as-is. **Scope:** B1–B3, FR-012.
      responses:
        '200':
          description: All bar drink sales (possibly none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrinkSaleList'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # =========================================================================
  # Hotel Analytics (Week 2 — Tillægsopgave uge 2)
  # =========================================================================

  /api/v1/kpis/hotel/summary:
    get:
      tags: [Hotel Analytics]
      operationId: getHotelSummary
      summary: Hotel KPI summary (annual or all-time revenue, occupancy, satisfaction, ALOS & ADR)
      description: |
        Calculates overall hotel KPIs in the backend business layer:
        - **A6 & K2**: Total room revenue (`total_revenue_dkk`), `booking_count`, `nights_sold`.
        - **K1**: Available room-nights (`available_room_nights`) and occupancy rate (`occupancy_rate_pct`).
        - **K3**: Guest review count (`review_count`), mean rating (`average_satisfaction`), and share of ratings ≥ 4 (`satisfied_share_pct`).
        - **A7**: Average length of stay (`average_length_of_stay_nights`), average daily rate (`average_daily_rate_dkk`), and average revenue per booking (`average_revenue_per_booking_dkk`).

        Supports optional filter attributes (`year`, `season`, `room_type`, `country`).
      parameters:
        - $ref: '#/components/parameters/ReportYear'
        - $ref: '#/components/parameters/SeasonFilter'
        - $ref: '#/components/parameters/RoomTypeFilter'
        - $ref: '#/components/parameters/CountryFilter'
      responses:
        '200':
          description: Hotel KPI summary for the requested filter scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/kpis/hotel/by-room-type:
    get:
      tags: [Hotel Analytics]
      operationId: listHotelKpisByRoomType
      summary: Hotel KPIs per room type, ranked by revenue (A4, K1, K2, K3, A7)
      description: |
        Returns one row per room type (8 rows when `room_type` filter is omitted, ordered by
        `revenue_rank` ascending). Includes `revenue_rank`, `revenue_dkk`, `revenue_share_pct` (**A4**, **K2**),
        `available_room_nights`, `occupancy_rate_pct` (**K1**), `review_count`, `average_satisfaction`,
        `satisfied_share_pct` (**K3**), and ALOS/ADR/revenue per booking (**A7**).
      parameters:
        - $ref: '#/components/parameters/ReportYear'
        - $ref: '#/components/parameters/SeasonFilter'
        - $ref: '#/components/parameters/RoomTypeFilter'
        - $ref: '#/components/parameters/CountryFilter'
      responses:
        '200':
          description: KPI breakdown by room type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomTypeKpiList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/kpis/hotel/by-season:
    get:
      tags: [Hotel Analytics]
      operationId: listHotelKpisBySeason
      summary: Hotel KPIs per season (low, mid, high — K1, K2, K3, A7)
      description: |
        Returns one row per season (`low`, `mid`, `high` in canonical order; 3 rows when `season`
        filter is omitted). Includes seasonal revenue & share (**K2**), `season_days`,
        `available_room_nights`, `occupancy_rate_pct` (**K1**), customer satisfaction (**K3**),
        and ALOS/ADR/revenue per booking (**A7**).
      parameters:
        - $ref: '#/components/parameters/ReportYear'
        - $ref: '#/components/parameters/SeasonFilter'
        - $ref: '#/components/parameters/RoomTypeFilter'
        - $ref: '#/components/parameters/CountryFilter'
      responses:
        '200':
          description: KPI breakdown by season.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonKpiList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/kpis/hotel/by-room-type-and-season:
    get:
      tags: [Hotel Analytics]
      operationId: listHotelKpisByRoomTypeAndSeason
      summary: Revenue, occupancy & stay KPIs per room type and season (A2, K1, K2, A7)
      description: |
        Returns one row per room type × season combination (24 rows when `room_type` and `season`
        filters are omitted, ordered by canonical room type order and then `low`, `mid`, `high`).
        **Scope:** A2 (FR-007), plus K1 and A7 per cell.
      parameters:
        - $ref: '#/components/parameters/ReportYear'
        - $ref: '#/components/parameters/SeasonFilter'
        - $ref: '#/components/parameters/RoomTypeFilter'
        - $ref: '#/components/parameters/CountryFilter'
      responses:
        '200':
          description: KPI breakdown by room type and season.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomTypeSeasonKpiList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/kpis/hotel/by-country:
    get:
      tags: [Hotel Analytics]
      operationId: listHotelKpisByCountry
      summary: Guest origin distribution & revenue per country, ranked by revenue (A1, A3, A5, K2)
      description: |
        Returns one row per guest country that has bookings in the filtered scope, ordered by
        `revenue_rank` ascending (ties broken alphabetically by country name).
        **Scope:** A1 (`booking_count`, `booking_share_pct`), A3 (`revenue_dkk`), and A5
        (`revenue_rank`, `revenue_share_pct`) (FR-009).
      parameters:
        - $ref: '#/components/parameters/ReportYear'
        - $ref: '#/components/parameters/SeasonFilter'
        - $ref: '#/components/parameters/RoomTypeFilter'
        - $ref: '#/components/parameters/CountryFilter'
      responses:
        '200':
          description: KPI breakdown by guest country.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryKpiList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/kpis/bar/summary:
    get:
      tags: [Hotel Analytics]
      operationId: getBarSummary
      summary: Helene Christine's total lobby bar sales (B1)
      description: |
        Calculates Helene Christine's total bar sales (`drink_count`, `units_sold`, `total_revenue_dkk`)
        for the requested `year` (or all time when `year=all` or omitted), optionally filtered by
        `category` (`Cocktail` or `Coffee`) and `price_tier` (`budget`, `standard`, `premium`).
        **Scope:** B1 (FR-013).
      parameters:
        - $ref: '#/components/parameters/ReportYear'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/PriceTierFilter'
      responses:
        '200':
          description: Bar KPI summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/kpis/bar/by-drink:
    get:
      tags: [Hotel Analytics]
      operationId: listBarKpisByDrink
      summary: Revenue per drink, popularity ranks & price tier (B2, A7 / US4)
      description: |
        Returns one row per drink on Helene Christine's menu with calculated `revenue_dkk`
        (`unit_price_dkk × units_sold`), `revenue_rank`, `units_rank`, and `price_tier`
        (`budget`, `standard`, `premium`), ordered by `revenue_rank` ascending (for `year=all`,
        ordered by `year` ascending and then `revenue_rank`). Supports optional `year`,
        `category`, and `price_tier` filters. **Scope:** B2 (FR-012, FR-013) and FR-016.
      parameters:
        - $ref: '#/components/parameters/ReportYear'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/PriceTierFilter'
      responses:
        '200':
          description: Per-drink revenue, ranks, and price tier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankedDrinkSaleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/kpis/bar/by-category:
    get:
      tags: [Hotel Analytics]
      operationId: listBarKpisByCategory
      summary: Percentage split between Cocktail and Coffee for Helene Christine (B3)
      description: |
        Returns category-level sales and percentage split (`Cocktail`, `Coffee`) both by unit volume
        (`unit_share_pct`) and by revenue (`revenue_share_pct`). **Scope:** B3 (FR-014).
      parameters:
        - $ref: '#/components/parameters/ReportYear'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/PriceTierFilter'
      responses:
        '200':
          description: KPI breakdown by drink category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarCategoryKpiList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/kpis/bar/by-price-tier:
    get:
      tags: [Hotel Analytics]
      operationId: listBarKpisByPriceTier
      summary: Bar demand per price tier — budget, standard, premium (A7 / US4)
      description: |
        Returns drink count, units sold, unit share (`%`), revenue, and revenue share (`%`) across
        price tiers (`budget` < 70 DKK, `standard` 70 to < 110 DKK, `premium` ≥ 110 DKK).
        **Scope:** A7 / US4 (FR-016).
      parameters:
        - $ref: '#/components/parameters/ReportYear'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/PriceTierFilter'
      responses:
        '200':
          description: KPI breakdown by price tier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarPriceTierKpiList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  parameters:
    BookingId:
      name: booking_id
      in: path
      required: true
      description: Booking identifier.
      schema:
        type: integer
        minimum: 1
        example: 42
    ReviewId:
      name: review_id
      in: path
      required: true
      description: Review identifier.
      schema:
        type: integer
        minimum: 1
        example: 7
    ReportYear:
      name: year
      in: query
      required: false
      description: |
        Reporting year (`2000`–`2100`), or `all` (default when omitted) for all-time totals across
        all recorded years (FR-021).
      schema:
        oneOf:
          - type: integer
            minimum: 2000
            maximum: 2100
            example: 2026
          - type: string
            enum: [all]
            example: all
    SeasonFilter:
      name: season
      in: query
      required: false
      description: Filter analytics to a specific season (`low`, `mid`, `high`).
      schema:
        $ref: '#/components/schemas/Season'
    RoomTypeFilter:
      name: room_type
      in: query
      required: false
      description: Filter analytics to one of Hotel Kong Arthur's 8 room types.
      schema:
        $ref: '#/components/schemas/RoomTypeName'
    CountryFilter:
      name: country
      in: query
      required: false
      description: Filter hotel analytics to bookings from a specific guest country.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        example: Germany
    CategoryFilter:
      name: category
      in: query
      required: false
      description: Filter bar analytics to a specific drink category (`Cocktail` or `Coffee`).
      schema:
        $ref: '#/components/schemas/DrinkCategory'
    PriceTierFilter:
      name: price_tier
      in: query
      required: false
      description: Filter bar analytics to a specific price tier (`budget`, `standard`, `premium`).
      schema:
        $ref: '#/components/schemas/PriceTier'

  headers:
    Location:
      description: Path of the created resource.
      schema:
        type: string
        example: /api/v1/bookings/1001

  responses:
    BadRequest:
      description: Malformed JSON, or an invalid query or path parameter.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:hotel-kong-arthur:problem:malformed-request
            title: Malformed request
            status: 400
            detail: A query or path parameter is invalid.
            errors:
              - field: year
                message: Must be a whole number from 2000 to 2100, or 'all'.
    NotFound:
      description: No resource with this id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:hotel-kong-arthur:problem:not-found
            title: Not found
            status: 404
            detail: Booking 4242 does not exist.
    ValidationFailed:
      description: The body is well-formed JSON, but one or more fields break the validation rules.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:hotel-kong-arthur:problem:validation-error
            title: Validation failed
            status: 422
            detail: 2 fields are invalid.
            errors:
              - field: days_rented
                message: Days rented must be a whole number from 1 to 365.
              - field: price_dkk
                message: 4,500.00 DKK for 3 nights is 1,500.00 DKK per night, outside 900.00–1,200.00 DKK per night for Standard Single in low season.
    ServiceUnavailable:
      description: The database cannot be reached.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:hotel-kong-arthur:problem:service-unavailable
            title: Service unavailable
            status: 503
            detail: The database is not reachable. Try again shortly.

  schemas:
    # ---------- Vocabulary ----------
    RoomTypeName:
      type: string
      description: One of Hotel Kong Arthur's 8 room types (English names, as in the sample data).
      enum:
        - Standard Single
        - Grand Lit
        - Standard Double
        - Superior Double
        - Junior Suite
        - Spa Executive
        - Suite
        - LOFT Suite
      example: Superior Double
    Season:
      type: string
      description: low = Jan, Feb, Nov; mid = Mar, Apr, May, Sep, Oct; high = Jun, Jul, Aug, Dec.
      enum: [low, mid, high]
      example: high
    DrinkCategory:
      type: string
      enum: [Cocktail, Coffee]
      example: Cocktail
    PriceTier:
      type: string
      description: budget < 70 DKK ≤ standard < 110 DKK ≤ premium (unit price).
      enum: [budget, standard, premium]
      example: premium
    AmountDkk:
      type: number
      format: double
      minimum: 0
      description: Amount in DKK, rounded to 2 decimals.
      example: 4389.00
    SharePct:
      type: number
      format: double
      minimum: 0
      maximum: 100
      description: Share of a breakdown total in percent (0–100, 2 decimals).
      example: 52.83
    RatePct:
      type: number
      format: double
      minimum: 0
      description: Rate in percent with 2 decimals.
      example: 6.89
    CalendarYear:
      type: integer
      minimum: 2000
      maximum: 2100
      description: Calendar year (2000–2100) on individual records.
      example: 2026
    Year:
      description: A calendar year (2000–2100), or `all` for the all-time scope of a KPI row (FR-021).
      oneOf:
        - type: integer
          minimum: 2000
          maximum: 2100
          example: 2026
        - type: string
          enum: [all]
          example: all
    Count:
      type: integer
      minimum: 0
      example: 1000
    Rank:
      type: integer
      minimum: 1
      description: Competition rank (1 = highest). Equal values share a rank.
      example: 1
    Satisfaction:
      type: number
      format: double
      minimum: 0
      maximum: 5
      description: Mean rating on the 1–5 scale with 2 decimals. 0 when there are no reviews.
      example: 3.74

    # ---------- Health ----------
    Health:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [ok]

    # ---------- Reference data ----------
    SeasonRate:
      type: object
      additionalProperties: false
      required: [season, min_nightly_dkk, max_nightly_dkk, standard_nightly_dkk]
      properties:
        season:
          $ref: '#/components/schemas/Season'
        min_nightly_dkk:
          $ref: '#/components/schemas/AmountDkk'
        max_nightly_dkk:
          $ref: '#/components/schemas/AmountDkk'
        standard_nightly_dkk:
          $ref: '#/components/schemas/AmountDkk'
    RoomType:
      type: object
      additionalProperties: false
      required: [name, name_da, room_count, max_guests, rates]
      properties:
        name:
          $ref: '#/components/schemas/RoomTypeName'
        name_da:
          type: string
          description: Danish name from the assignment brief.
          example: Superior dobbeltværelse
        room_count:
          type: integer
          minimum: 1
          example: 27
        max_guests:
          type: integer
          minimum: 1
          maximum: 4
          example: 2
        rates:
          type: array
          description: One rate band per season, in the order low, mid, high.
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/SeasonRate'
    RoomTypeList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomType'

    # ---------- Bookings ----------
    BookingInput:
      type: object
      additionalProperties: false
      description: |
        Client-editable booking fields, used by both create (`POST`) and replace (`PUT`).
        Names and country are trimmed and must not be empty.
      required: [first_name, family_name, country, room_type, check_in_date, days_rented]
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Elena
        family_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Müller
        country:
          type: string
          minLength: 1
          maxLength: 100
          example: Germany
        room_type:
          $ref: '#/components/schemas/RoomTypeName'
        check_in_date:
          type: string
          format: date
          description: Check-in date (YYYY-MM-DD, years 2000–2100). The season and reporting year are derived from it.
          example: '2026-07-14'
        days_rented:
          type: integer
          minimum: 1
          maximum: 365
          description: Number of nights.
          example: 3
        price_dkk:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          description: |
            Total price in DKK with at most 2 decimals. If neither this nor `price_per_night_dkk` is
            given (omitted or `null`), the price is the room type's standard nightly rate for the
            season × `days_rented`. If it is given, `price_dkk / days_rented` must lie inside the room
            type's band for the season (see `GET /api/v1/room-types`). Giving `price_per_night_dkk`
            as well is a `422`.
          example: 6000.00
        price_per_night_dkk:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          description: |
            Fixed price per night in DKK with at most 2 decimals (FR-019). The stored total is this ×
            `days_rented`, and the price per night must lie inside the room type's band for the
            season. Mutually exclusive with `price_dkk`: giving both is a `422` reported on this
            field. A booking is read back with its total only (`price_dkk`).
          example: 2000.00
    Booking:
      type: object
      additionalProperties: false
      required: [id, first_name, family_name, country, room_type, check_in_date, days_rented, price_dkk, season, year, created_at, updated_at]
      properties:
        id:
          type: integer
          minimum: 1
          example: 1001
        first_name:
          type: string
          example: Elena
        family_name:
          type: string
          example: Müller
        country:
          type: string
          example: Germany
        room_type:
          $ref: '#/components/schemas/RoomTypeName'
        check_in_date:
          type: string
          format: date
          example: '2026-07-14'
        days_rented:
          type: integer
          minimum: 1
          maximum: 365
          example: 3
        price_dkk:
          $ref: '#/components/schemas/AmountDkk'
        season:
          $ref: '#/components/schemas/Season'
        year:
          $ref: '#/components/schemas/CalendarYear'
        created_at:
          type: string
          format: date-time
          example: '2026-10-27T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-10-27T12:00:00Z'
    BookingList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Booking'

    # ---------- Reviews ----------
    ReviewInput:
      type: object
      additionalProperties: false
      description: Give either `booking_id`, or both `room_type` and `stay_date`.
      required: [rating]
      properties:
        booking_id:
          type: integer
          minimum: 1
          example: 1001
        room_type:
          $ref: '#/components/schemas/RoomTypeName'
        stay_date:
          type: string
          format: date
          description: Check-in date of the reviewed stay (years 2000–2100).
          example: '2026-07-14'
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
    Review:
      type: object
      additionalProperties: false
      required: [id, booking_id, room_type, stay_date, season, year, rating, created_at]
      properties:
        id:
          type: integer
          minimum: 1
          example: 501
        booking_id:
          type: integer
          minimum: 1
          nullable: true
          description: The reviewed booking, or `null` if the review was recorded without one or the booking was deleted.
          example: 1001
        room_type:
          $ref: '#/components/schemas/RoomTypeName'
        stay_date:
          type: string
          format: date
          example: '2026-07-14'
        season:
          $ref: '#/components/schemas/Season'
        year:
          $ref: '#/components/schemas/CalendarYear'
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        created_at:
          type: string
          format: date-time
          example: '2026-10-27T12:05:00Z'
    ReviewList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Review'

    # ---------- Bar (raw dataset under 'Bar' tag) ----------
    DrinkSale:
      type: object
      additionalProperties: false
      required: [id, year, drink_name, category, unit_price_dkk, units_sold]
      properties:
        id:
          type: integer
          minimum: 1
          example: 1
        year:
          $ref: '#/components/schemas/CalendarYear'
        drink_name:
          type: string
          example: Margarita
        category:
          $ref: '#/components/schemas/DrinkCategory'
        unit_price_dkk:
          $ref: '#/components/schemas/AmountDkk'
        units_sold:
          $ref: '#/components/schemas/Count'
    DrinkSaleList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DrinkSale'

    # ---------- Hotel Analytics: Hotel KPIs ----------
    HotelSummary:
      type: object
      additionalProperties: false
      required:
        - year
        - booking_count
        - nights_sold
        - total_revenue_dkk
        - available_room_nights
        - occupancy_rate_pct
        - review_count
        - average_satisfaction
        - satisfied_share_pct
        - average_length_of_stay_nights
        - average_daily_rate_dkk
        - average_revenue_per_booking_dkk
      properties:
        year:
          $ref: '#/components/schemas/Year'
        booking_count:
          $ref: '#/components/schemas/Count'
        nights_sold:
          $ref: '#/components/schemas/Count'
        total_revenue_dkk:
          allOf:
            - $ref: '#/components/schemas/AmountDkk'
          description: The hotel's room revenue for the scope (A6, K2).
        available_room_nights:
          allOf:
            - $ref: '#/components/schemas/Count'
          description: Rooms in scope × days in scope (78,110 for all 214 rooms in 2026).
        occupancy_rate_pct:
          allOf:
            - $ref: '#/components/schemas/RatePct'
          description: nights_sold ÷ available_room_nights × 100 (K1).
        review_count:
          $ref: '#/components/schemas/Count'
        average_satisfaction:
          $ref: '#/components/schemas/Satisfaction'
        satisfied_share_pct:
          allOf:
            - $ref: '#/components/schemas/RatePct'
          description: Share of reviews rated 4 or 5 (K3).
        average_length_of_stay_nights:
          type: number
          format: double
          minimum: 0
          description: ALOS = nights_sold ÷ booking_count (A7).
          example: 5.38
        average_daily_rate_dkk:
          allOf:
            - $ref: '#/components/schemas/AmountDkk'
          description: ADR = room revenue ÷ nights_sold (A7).
        average_revenue_per_booking_dkk:
          allOf:
            - $ref: '#/components/schemas/AmountDkk'
          description: Room revenue ÷ booking_count (A7).
      example:
        year: 2026
        booking_count: 1000
        nights_sold: 5379
        total_revenue_dkk: 11234034.00
        available_room_nights: 78110
        occupancy_rate_pct: 6.89
        review_count: 500
        average_satisfaction: 3.74
        satisfied_share_pct: 64.20
        average_length_of_stay_nights: 5.38
        average_daily_rate_dkk: 2088.50
        average_revenue_per_booking_dkk: 11234.03
