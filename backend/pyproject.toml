[project]
name = "hotel-api"
version = "0.1.0"
description = "REST API for Hotel Kong Arthur operations and analytics platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0,<0.163.0",
    "uvicorn>=0.54.0,<0.55.0",
    "pydantic>=2.14.1,<2.15.0",
    "pymysql[rsa]>=1.2.3,<1.3.0",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0,<10.0.0",
    "httpx>=0.28.1,<0.29.0",
    "openapi-core>=0.23.1,<0.24.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
markers = [
    "unit: pure business logic and rule unit tests (no db)",
    "contract: API contract response validation against openapi.yaml",
    "integration: repository and database integration tests",
    "architecture: layer boundary and repository constraint tests",
]

