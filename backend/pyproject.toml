[project]
name = "hotel-api"
version = "0.1.0"
description = "REST API for Hotel Kong Arthur operations and analytics platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "pydantic>=2.10.0,<2.11.0",
    "pymysql[rsa]>=1.1.1,<1.2.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "openapi-core>=0.19.4",
    "openapi-spec-validator>=0.7.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: pure business logic and rule unit tests (no db)",
    "contract: API contract response validation against openapi.yaml",
    "integration: repository and database integration tests",
    "architecture: layer boundary and repository constraint tests",
]

